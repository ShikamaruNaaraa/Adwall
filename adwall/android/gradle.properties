org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Windows-only: the Kotlin incremental compiler crashes when the project
# (D:\...) and the pub cache (C:\...) are on different drive letters, since
# it can't compute a relative path across drive roots. Incremental builds
# are slower but this avoids the crash.
kotlin.incremental=false
flutter.compileSdkVersion=36
